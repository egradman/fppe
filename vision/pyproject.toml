[project]
name = "vision"
version = "0.1.0"
description = "Skynet-side scene-description service (Moondream2 VLM) backing the fppe robot's on-demand 'look' tool."
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- torch (Blackwell / RTX 5080 sm_120 needs cu128 wheels; matches nav/) ---
    "torch",
    "torchvision",
    # --- Moondream2 (custom modeling code) + preprocessing ---
    # Moondream's trust_remote_code modeling predates transformers v5's model-
    # loading internals (v5 expects `all_tied_weights_keys`), so pin to 4.x.
    "transformers>=4.44,<5",
    "einops",
    "accelerate",
    "pillow",
    "pyvips-binary",  # some recent moondream revisions decode via libvips
    "pyvips",
]

[project.scripts]
vision = "vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

# Blackwell needs CUDA 12.8 torch wheels; pull torch/torchvision from PyTorch's cu128 index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
