# Install on the fppe Pi as (system-wide + persistent):
#   sudo cp voice/fppe-wireplumber-disable-jabra.conf \
#     /etc/wireplumber/wireplumber.conf.d/50-disable-jabra.conf
# then: systemctl --user restart wireplumber   (or reboot)
#
# Purple's voice client opens the Jabra SPEAK 410 directly via raw ALSA (see
# fppe.asoundrc). PipeWire also tries to manage the same USB device, and the two
# fight over it — which makes mic capture flaky and can leave the ALSA device
# unopenable at boot. This is a dedicated robot with one audio app, so we don't
# need PipeWire mediating the Jabra: tell WirePlumber to ignore that card so our
# client owns it exclusively. (HDMI and any other devices are unaffected.)
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb.*Jabra.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
