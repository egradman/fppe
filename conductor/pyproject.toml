[project]
name = "conductor"
version = "0.1.0"
description = "Behavior-tree conductor for the fppe robot: modes and sequenceable activities over viser_control's HTTP API."
requires-python = ">=3.11"
dependencies = [
    "py_trees>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
conductor = "conductor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
