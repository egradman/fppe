# nav — autonomous navigation to a named location on the topological route.
#
# navigate_to is real as of Phase 3: nav-serve follows the loaded route's
# breadcrumbs from the localized start to the labeled goal node. The label must
# exist in the loaded route ('kitchen' is a house target); for the garage test
# use the navigate_inward / navigate_outward modes.
type: sequence
name: nav
memory: true
children:
  - { type: set_base_source, params: { value: "auto" } }
  - { type: navigate_to, params: { label: "kitchen" } }
