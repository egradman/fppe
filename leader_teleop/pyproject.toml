[project]
name = "leader_teleop"
version = "0.1.0"
description = "Standalone skynet-side leader-arm reader + UDP streamer for the LeKiwi follower."
requires-python = ">=3.11"
dependencies = [
    "feetech-servo-sdk>=1.0.0,<2.0.0",
    "pydantic>=2.0",
    "pyserial>=3.5",
]

[project.scripts]
leader-calibrate = "leader_teleop.calibrate:main"
leader-teleop = "leader_teleop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leader_teleop"]
